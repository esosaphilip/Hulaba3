[versions]
agp = "8.5.2"
kotlin = "2.0.21"
coreKtx = "1.15.0"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
lifecycleRuntimeKtx = "2.8.7"
activityCompose = "1.10.1"
composeBom = "2025.02.00"
room = "2.6.1"
koin = "3.5.3"
navigation = "2.8.8"
workmanager = "2.10.0"
lifecycle = "2.8.7"
ksproom = "2.0.21-1.0.28"
kotlinx-coroutines = "1.7.3"
# PDF Processing
itext = "8.0.2"
pdfbox = "3.0.1"

# AI and HTTP
okhttp = "4.12.0"
retrofit = "2.9.0"
gson = "2.10.1"
generative-ai = "0.2.2"

# Supabase
supabase = "2.0.4"

# Audio/Media
exoplayer = "1.4.1"
media3 = "1.4.1"

# ML Kit
mlkit-text = "16.0.1"

# Additional Compose
compose-material-icons = "1.5.4"
compose-animation = "1.5.4"

# Camera
camera = "1.4.0"

# DataStore
datastore = "1.1.1"

# Coil for images
coil = "2.6.0"

docfile = "1.0.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-androidx-compose = { module = "io.insert-koin:koin-androidx-compose", version.ref = "koin" }

lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
workmanager = { module = "androidx.work:work-runtime-ktx", version.ref = "workmanager" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }

# Supabase
supabase-bom = { module = "io.github.jan-tennert.supabase:bom", version.ref = "supabase" }
supabase-postgrest = { module = "io.github.jan-tennert.supabase:postgrest-kt" }
supabase-realtime = { module = "io.github.jan-tennert.supabase:realtime-kt" }
supabase-storage = { module = "io.github.jan-tennert.supabase:storage-kt" }
supabase-auth = { module = "io.github.jan-tennert.supabase:gotrue-kt" }
supabase-functions = { module = "io.github.jan-tennert.supabase:functions-kt" }

# Audio/Media
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }

# ML Kit
mlkit-text-recognition = { module = "com.google.mlkit:text-recognition", version.ref = "mlkit-text" }

# Compose Material Icons
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version.ref = "compose-material-icons" }

# Camera
camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camera" }
camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camera" }
camera-view = { module = "androidx.camera:camera-view", version.ref = "camera" }

# DataStore
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
datastore-core = { module = "androidx.datastore:datastore-core", version.ref = "datastore" }

# Coil for images
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }
coil-gif = { module = "io.coil-kt:coil-gif", version.ref = "coil" }
coil-svg = { module = "io.coil-kt:coil-svg", version.ref = "coil" }

# PDF Processing (choose one - iText is more feature-rich, PDFBox is lighter)
itext-core = { group = "com.itextpdf", name = "itext-core", version.ref = "itext" }
itext-layout = { group = "com.itextpdf", name = "layout", version.ref = "itext" }
# Alternative: PDFBox (uncomment if you prefer this)
# pdfbox-android = { group = "com.tom-roush", name = "pdfbox-android", version.ref = "pdfbox" }

# HTTP and API calls
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }

# Google Generative AI (Gemini)
generativeai = { group = "com.google.ai.client.generativeai", name = "generativeai", version.ref = "generative-ai" }

# Hilt (Dependency Injection) - update to a newer version to resolve JavaPoet canonicalName issue
hilt-android = { module = "com.google.dagger:hilt-android", version = "2.46.1" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version = "2.46.1" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version = "1.2.0" }

documentfile = { group = "androidx.documentfile", name = "documentfile", version.ref = "docfile" }


[bundles]
# AI Quiz features bundle
ai-quiz = [
    "itext-core",
    "itext-layout",
    "okhttp",
    "okhttp-logging",
    "retrofit",
    "retrofit-gson",
    "gson",
    "generativeai",
    "documentfile"
]

# Supabase bundle
supabase = [
    "supabase-bom",
    "supabase-postgrest",
    "supabase-realtime",
    "supabase-storage",
    "supabase-auth",
    "supabase-functions"
]

# Audio/Media bundle
media = [
    "media3-exoplayer",
    "media3-ui",
    "media3-common"
]

# ML Kit bundle
mlkit = [
    "mlkit-text-recognition"
]

# Camera bundle
camera = [
    "camera-camera2",
    "camera-lifecycle",
    "camera-view"
]

# DataStore bundle
datastore = [
    "datastore-preferences",
    "datastore-core"
]

# Coil bundle
coil = [
    "coil-compose",
    "coil-gif",
    "coil-svg"
]

# Hilt bundle
hilt = [
    "hilt-android",
    "hilt-compiler",
    "hilt-navigation-compose"
]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = {id = "com.google.devtools.ksp", version.ref = "ksproom"}
hilt = {id = "com.google.dagger.hilt.android", version = "2.46.1"}